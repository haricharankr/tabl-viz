name: Build macOS DMG

on:
  # Auto-build when you push a version tag like v1.0.0
  push:
    tags:
      - 'v*'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          CI: false  # Prevents treating warnings as errors

      - name: Build DMG
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: ls -lh dist/

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabl-Viz-macOS
          path: dist/*.dmg
          retention-days: 90

      - name: Create GitHub Release with DMG
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## Tabl Viz ${{ github.ref_name }}

            ### Installation
            1. Download the `.dmg` file below
            2. Open it and drag **Tabl Viz** to **Applications**
            3. Launch from Applications
            4. If macOS warns about an unidentified developer, go to **System Settings > Privacy & Security** and click "Open Anyway"

            ### Supported file formats
            CSV, Excel (.xlsx), JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
